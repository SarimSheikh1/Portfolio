services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sarim
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: idea_universe
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarim -d idea_universe"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
